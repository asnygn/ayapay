<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
  </head>
  <body>
    <a href="#" onclick="openAYAPayWallet()">Open GNext Testing 3</a>
    <script>
      function getOS() {
        const userAgent = window.navigator.userAgent;
        const platform =
          window.navigator?.userAgentData?.platform ||
          window.navigator.platform;
        const macosPlatforms = ["macOS", "Macintosh", "MacIntel"];
        const windowsPlatforms = ["Win32", "Win64", "Windows", "WinCE"];
        const iosPlatforms = ["iPhone", "iPad", "iPod"];
        const huaweiPlatforms = ["huawei", "honor", "HMSCore", "HuaweiBrowser"];
        let os = "Unknown";

        if (macosPlatforms.indexOf(platform) !== -1) {
          os = "mac";
        } else if (iosPlatforms.indexOf(platform) !== -1) {
          os = "ios";
        } else if (windowsPlatforms.indexOf(platform) !== -1) {
          os = "windows";
        } else if (/Android/.test(userAgent)) {
          os = "android";
        } else if (huaweiPlatforms.indexOf(platform) !== -1) {
          os = "huawei";
        } else if (/Linux/.test(platform)) {
          os = "linux";
        }

        return os;
      }

      function openAYAPayWallet() {
        const deepLink =
          "ayapay://mLink/screen=Biller?id=6902ddd10a5768086a5f2c6c&category=SmartDevices";
        const playStoreUrl = `https://play.google.com/store/apps/details?id=com.ayaplus.subscriber`;
        const appStoreUrl =
          "https://apps.apple.com/us/app/aya-pay-wallet/id1485836756";
        const appGalleryUrl = "https://appgallery.huawei.com/app/C102449653";
        const devicePlatform = getOS();

        let appOpened = false;

        window.location.href = deepLink;

        setTimeout(() => {
          if (!appOpened && !document.hidden) {
            if (
              devicePlatform === "windows" ||
              devicePlatform === "android" ||
              devicePlatform === "linux"
            ) {
              window.location.href = playStoreUrl;
            } else if (devicePlatform === "mac" || devicePlatform === "ios") {
              window.location.href = appStoreUrl;
            } else if (devicePlatform === "huawei") {
              window.location.href = appGalleryUrl;
            }
          }
        }, 2500);

        window.onblur = () => {
          // appOpened = true;
        };
      }
    </script>
  </body>
</html>
